# Camino de ejecución alternativo (el README prioriza npm).
#   docker compose up --build
# Frontend: http://localhost:5173  ·  Backend: http://localhost:3000
#
# Los valores por defecto sirven para una demo local. Se pueden sobreescribir con
# un archivo .env en esta carpeta o exportando las variables.

services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-demo-secret-cambiar-en-produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '3000:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
